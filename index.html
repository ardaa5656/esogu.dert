<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESOGÜ Canlı Sohbet</title>
  <!-- Açık MQTT WebSocket Kütüphanesi -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; height: 100vh; overflow: hidden; }
    
    .chat-app { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #131b2e; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    
    /* Üst Başlık */
    .header { padding: 12px 16px; background: #0b0f19; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .status-dot { width: 9px; height: 9px; background: #ef4444; border-radius: 50%; transition: 0.3s; }
    .status-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .title { font-size: 15px; font-weight: 700; color: #f8fafc; }
    
    .nick-btn { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .nick-btn:hover { color: #fff; border-color: #6366f1; }

    /* Mesaj Akışı */
    .messages-area { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .system-msg { align-self: center; font-size: 11px; background: #1e293b; color: #94a3b8; padding: 3px 10px; border-radius: 12px; }
    
    .msg-bubble { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: #1e293b; align-self: flex-start; word-break: break-word; font-size: 14px; line-height: 1.4; }
    .msg-bubble.mine { background: #4f46e5; align-self: flex-end; }
    .msg-info { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; margin-bottom: 3px; font-weight: 600; color: #94a3b8; }
    .msg-bubble.mine .msg-info { color: #c7d2fe; }
    .msg-time { font-weight: 400; opacity: 0.8; }

    /* Alt Yazma Çubuğu */
    .input-bar { padding: 12px; background: #0b0f19; border-top: 1px solid #1e293b; display: flex; gap: 8px; align-items: center; }
    .input-bar input { flex: 1; background: #131b2e; border: 1px solid #1e293b; color: #fff; padding: 10px 14px; border-radius: 20px; outline: none; font-size: 14px; }
    .input-bar input:focus { border-color: #4f46e5; }
    .input-bar button { background: #4f46e5; color: #fff; border: none; padding: 10px 16px; border-radius: 20px; font-weight: 600; font-size: 13px; cursor: pointer; }
    .input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="chat-app">
    <!-- Üst Bar -->
    <div class="header">
      <div class="header-left">
        <div class="status-dot" id="dot"></div>
        <span class="title">ESOGÜ Canlı Sohbet</span>
      </div>
      <button class="nick-btn" id="nick-btn" title="Takma adını değiştir">Anonim</button>
    </div>

    <!-- Mesaj Listesi -->
    <div class="messages-area" id="msg-box">
      <div class="system-msg">Canlı odaya bağlanılıyor...</div>
    </div>

    <!-- Mesaj Gönderme Formu -->
    <form class="input-bar" id="chat-form">
      <input type="text" id="text-input" placeholder="Mesaj yaz..." maxlength="250" autocomplete="off" disabled>
      <button type="submit" id="send-btn" disabled>Gönder</button>
    </form>
  </div>

  <script>
    // 1. Kanal Ayarı (Bunu istediğin rastgele bir oda ismi yapabilirsin)
    const ODA_KANALI = "esogu/canli_lobi_v1_99";

    // 2. Takma Ad Yönetimi
    let myNick = localStorage.getItem("esogu_chat_nick") || "Öğrenci#" + Math.floor(1000 + Math.random() * 9000);
    const nickBtn = document.getElementById("nick-btn");
    nickBtn.innerText = myNick;

    nickBtn.addEventListener("click", () => {
      const yeni = prompt("Yeni takma adını gir (Maks 15 karakter):", myNick);
      if (yeni && yeni.trim().length > 1) {
        myNick = yeni.trim().substring(0, 15);
        localStorage.setItem("esogu_chat_nick", myNick);
        nickBtn.innerText = myNick;
      }
    });

    // 3. UI Elementleri
    const dot = document.getElementById("dot");
    const msgBox = document.getElementById("msg-box");
    const textInput = document.getElementById("text-input");
    const sendBtn = document.getElementById("send-btn");
    const chatForm = document.getElementById("chat-form");

    // 4. MQTT Canlı Bağlantısı
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'usr_' + Math.random().toString(16).substr(2, 8),
      clean: true,
      reconnectPeriod: 2000
    });

    client.on('connect', () => {
      dot.classList.add("online");
      textInput.disabled = false;
      sendBtn.disabled = false;
      addSystemMsg("Canlı ağa bağlandın. Yazılanlar herkese anlık gider.");
      client.subscribe(ODA_KANALI);
    });

    client.on('offline', () => {
      dot.classList.remove("online");
      textInput.disabled = true;
      sendBtn.disabled = true;
      addSystemMsg("Bağlantı koptu, yeniden bağlanılıyor...");
    });

    // 5. Gelen Mesajı Dinleme
    client.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        const isMine = data.sender === myNick;
        addMessage(data.sender, data.text, data.time, isMine);
        
        // Başkasından mesaj geldiyse hafif bir bildirim sesi çal
        if (!isMine) playBeep();
      } catch (err) {
        console.error("Mesaj hatası:", err);
      }
    });

    // 6. Güvenli Mesaj Ekleme (XSS / HTML injection korumalı)
    function addMessage(sender, text, time, isMine) {
      const bubble = document.createElement("div");
      bubble.className = `msg-bubble ${isMine ? 'mine' : ''}`;

      const infoDiv = document.createElement("div");
      infoDiv.className = "msg-info";

      const senderSpan = document.createElement("span");
      senderSpan.textContent = sender; // Güvenli textContent

      const timeSpan = document.createElement("span");
      timeSpan.className = "msg-time";
      timeSpan.textContent = time;

      infoDiv.appendChild(senderSpan);
      infoDiv.appendChild(timeSpan);

      const textDiv = document.createElement("div");
      textDiv.textContent = text; // HTML etiketlerini düz yazı yapar

      bubble.appendChild(infoDiv);
      bubble.appendChild(textDiv);

      msgBox.appendChild(bubble);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function addSystemMsg(txt) {
      const sys = document.createElement("div");
      sys.className = "system-msg";
      sys.textContent = txt;
      msgBox.appendChild(sys);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    // 7. Mesaj Gönderme
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = textInput.value.trim();
      if (!val) return;

      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ":" + 
                      String(now.getMinutes()).padStart(2, '0');

      const packet = {
        sender: myNick,
        text: val,
        time: timeStr
      };

      client.publish(ODA_KANALI, JSON.stringify(packet));
      textInput.value = "";
    });

    // 8. Dosyasız Sentetik Ses Efekti (Web Audio API)
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 520;
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.15);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }
  </script>
</body>
</html>
