<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESOGÜ Canlı Sohbet</title>
  <!-- Kayıt/Hesap gerektirmeyen açık MQTT kütüphanesi -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .chat-box { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #1e293b; }
    .header { padding: 14px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: bold; }
    .dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
    .dot.connected { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #334155; padding: 10px 14px; border-radius: 12px; max-width: 80%; align-self: flex-start; word-break: break-word; }
    .msg.self { background: #6366f1; align-self: flex-end; }
    .msg-sender { font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 3px; }
    .msg.self .msg-sender { color: #e0e7ff; }
    .input-area { padding: 12px; background: #0f172a; display: flex; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 14px; border-radius: 20px; outline: none; }
    button { background: #6366f1; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="chat-box">
    <div class="header">
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="status-text">Sunucuya bağlanıyor...</span>
      </div>
      <span id="user-name" style="font-size: 12px; color: #94a3b8;"></span>
    </div>

    <div class="messages" id="msgs">
      <div style="font-size: 12px; color: #64748b; text-align: center;">Bağlantı kurulduğunda yazılanlar tüm cihazlara anlık düşer.</div>
    </div>

    <form class="input-area" id="form">
      <input type="text" id="input" placeholder="Mesaj yaz..." autocomplete="off" required disabled>
      <button type="submit" id="btn" disabled>Gönder</button>
    </form>
  </div>

  <script>
    // Anonim kullanıcı adı
    const myId = "ogrenci_" + Math.random().toString(36).substring(2, 7);
    document.getElementById("user-name").innerText = myId;

    // Ortak kanal adı (Kendi aranızda konuşmak için bu ismi değiştirebilirsin)
    const ODA_KANALI = "esogu/genel_dert_odasi_9823";

    // Dünyaya açık, ücretsiz WebSocket MQTT Broker'ı (Kayıt, key gerektirmez)
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
      clientId: 'client_' + Math.random().toString(16).substr(2, 8),
      clean: true,
      connectTimeout: 4000,
      reconnectPeriod: 2000
    });

    const dot = document.getElementById("dot");
    const statusText = document.getElementById("status-text");
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");
    const msgs = document.getElementById("msgs");

    // Canlı internet sunucusuna bağlandığında
    client.on('connect', () => {
      dot.classList.add("connected");
      statusText.innerText = "Canlı İnternet Ağı";
      input.disabled = false;
      btn.disabled = false;

      // Odaya abone ol
      client.subscribe(ODA_KANALI, (err) => {
        if (!err) {
          console.log("Odaya başarıyla bağlandı!");
        }
      });
    });

    client.on('offline', () => {
      dot.classList.remove("connected");
      statusText.innerText = "Bağlantı koptu...";
      input.disabled = true;
      btn.disabled = true;
    });

    // Başka bir telefondan/cihazdan mesaj geldiğinde
    client.on('message', (topic, payload) => {
      try {
        const data = JSON.parse(payload.toString());
        ekranaYazdir(data.sender, data.text, data.sender === myId);
      } catch (e) {
        console.error("Mesaj parse edilemedi", e);
      }
    });

    function ekranaYazdir(sender, text, isSelf) {
      const div = document.createElement("div");
      div.className = `msg ${isSelf ? 'self' : ''}`;
      div.innerHTML = `<div class="msg-sender">${sender}</div><div>${text}</div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    // Mesaj gönderme
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      const paket = JSON.stringify({
        sender: myId,
        text: text,
        time: Date.now()
      });

      // İnternet üzerinden odaya fırlat
      client.publish(ODA_KANALI, paket);
      input.value = "";
    });
  </script>
</body>
</html>
