<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kampüs Canlı Lobi</title>
  <!-- Hazır P2P Kütüphanesi (Kayıt / API Key Gerektirmez) -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 480px; height: 100%; display: flex; flex-direction: column; background: #1e293b; }
    .header { padding: 14px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .status { font-size: 13px; color: #22c55e; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { background: #334155; padding: 10px 14px; border-radius: 12px; max-width: 85%; align-self: flex-start; }
    .msg.self { background: #4f46e5; align-self: flex-end; }
    .msg-user { font-size: 11px; font-weight: bold; color: #94a3b8; margin-bottom: 2px; }
    .msg.self .msg-user { color: #c7d2fe; }
    .input-box { padding: 12px; background: #0f172a; display: flex; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 14px; border-radius: 20px; outline: none; }
    button { background: #4f46e5; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="header">
      <div class="status"><span class="dot"></span> ESOGÜ Lobi</div>
      <span id="my-name" style="font-size: 12px; color: #94a3b8;">Bağlanıyor...</span>
    </div>

    <div class="messages" id="messages">
      <div class="msg" style="align-self: center; background: #334155; font-size: 12px; color: #94a3b8;">
        Sohbete bağlandın. Yazılanlar anlık görünür.
      </div>
    </div>

    <form class="input-box" id="form">
      <input type="text" id="text" placeholder="Anonim mesaj yaz..." required autocomplete="off">
      <button type="submit">Gönder</button>
    </form>
  </div>

  <script>
    // Rastgele anonim takma ad
    const nick = "Öğrenci#" + Math.floor(1000 + Math.random() * 9000);
    document.getElementById("my-name").innerText = nick;

    // Ortak P2P Ağı
    const connections = [];
    const peer = new Peer();

    peer.on('open', (id) => {
      // Odaya dahil olan herkes birbirinin ID'sini dinler
      console.log('Bağlantı ID:', id);
    });

    // Başkası sana bağlandığında
    peer.on('connection', (conn) => {
      setupConnection(conn);
    });

    function setupConnection(conn) {
      connections.push(conn);
      conn.on('data', (data) => {
        addMessage(data.sender, data.text, false);
      });
    }

    // Mesaj Ekrana Yazdırma
    function addMessage(sender, text, isSelf) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = `msg ${isSelf ? 'self' : ''}`;
      div.innerHTML = `<div class="msg-user">${sender}</div><div>${text}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // Mesaj Gönderme
    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("text");
      const val = input.value.trim();
      if (!val) return;

      addMessage(nick, val, true);

      // Bağlı herkese gönder
      connections.forEach(conn => {
        if (conn.open) conn.send({ sender: nick, text: val });
      });

      input.value = "";
    });
  </script>
</body>
</html>
